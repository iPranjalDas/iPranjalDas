<style>
@keyframes wipe {
  0% { opacity: 0; transform: translateX(-5px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}
.cursor { animation: blink 0.9s infinite; }
.fade-in { animation: wipe 0.35s ease-out backwards; }
</style>
